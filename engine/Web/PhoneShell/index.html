<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>iPhone 17 Pro Web Phone</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="phone-stage">
      <div
        class="phone-frame"
        data-device="iphone-17-pro"
        data-viewport="402x874"
        aria-label="iPhone 17 Pro web container, 402 by 874 CSS pixels"
      >
        <div class="phone-scale">
          <span class="side-button action-button" aria-hidden="true"></span>
          <span class="side-button volume-up" aria-hidden="true"></span>
          <span class="side-button volume-down" aria-hidden="true"></span>
          <span class="side-button power-button" aria-hidden="true"></span>

          <div class="phone-body">
            <div id="app-viewport" class="app-viewport">
              <div class="dynamic-island" aria-hidden="true">
                <span class="island-camera"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>HTML 原型</title><style>* {
  box-sizing: border-box;
}

:root {
  /* iPhone 17 Pro: 1206 × 2622 physical pixels at 3×. */
  --iphone-17-pro-width: 402px;
  --iphone-17-pro-height: 874px;
  --phone-bezel: 16px;
  --phone-frame-width: 434px;
  --phone-frame-height: 906px;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  background: #ececec;
}

.phone-stage {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 20px;
}

.phone-frame {
  --phone-scale: 1;
  --phone-layout-width: var(--phone-frame-width);
  --phone-layout-height: var(--phone-frame-height);
  position: relative;
  width: var(--phone-layout-width);
  height: var(--phone-layout-height);
}

.phone-scale {
  position: relative;
  width: var(--phone-frame-width);
  height: var(--phone-frame-height);
  transform: scale(var(--phone-scale));
  transform-origin: top left;
}

.phone-body {
  position: absolute;
  inset: 0 auto auto 0;
  width: var(--phone-frame-width);
  height: var(--phone-frame-height);
  padding: var(--phone-bezel);
  border: 2px solid #343637;
  border-radius: 70px;
  background: linear-gradient(
    115deg,
    #777a7b 0%,
    #222425 8%,
    #050606 50%,
    #2c2e2e 93%,
    #777a7b 100%
  );
  box-shadow:
    0 42px 72px rgba(0, 0, 0, 0.2),
    0 12px 24px rgba(0, 0, 0, 0.14),
    inset 0 0 0 1px rgba(255, 255, 255, 0.14);
}

.phone-body::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 65px;
  pointer-events: none;
}

.app-viewport {
  position: relative;
  width: var(--iphone-17-pro-width);
  height: var(--iphone-17-pro-height);
  overflow: hidden;
  border-radius: 58px;
  background: #000;
  outline: 8px solid #050606;
  box-shadow: 0 0 0 9px rgba(255, 255, 255, 0.08);
}

.dynamic-island {
  position: absolute;
  z-index: 10;
  top: 12px;
  left: 50%;
  width: 122px;
  height: 34px;
  border-radius: 20px;
  background: #030303;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
  transform: translateX(-50%);
}

.island-camera {
  position: absolute;
  top: 13px;
  right: 16px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 35%,
    #1c496a,
    #08131c 45%,
    #000 70%
  );
}

.side-button {
  position: absolute;
  z-index: 2;
  width: 4px;
  border-radius: 3px 0 0 3px;
  background: linear-gradient(90deg, #323434, #767979);
}

.action-button {
  top: 144px;
  left: -3px;
  height: 36px;
}

.volume-up {
  top: 212px;
  left: -3px;
  height: 66px;
}

.volume-down {
  top: 294px;
  left: -3px;
  height: 66px;
}

.power-button {
  top: 226px;
  right: -3px;
  height: 102px;
  border-radius: 0 3px 3px 0;
}


/* Embed the supplied shell on the same 456 x 910 stage as the simulator.
   Border-box padding includes the 2px border so the screen is centered. */
html,body{height:100%;min-height:0;background:transparent;overflow:hidden}
.phone-stage{position:absolute;left:0;top:0;width:456px;height:910px;min-height:0;padding:0;display:block;transform-origin:top left;overflow:visible}
.phone-frame{position:absolute;left:11px;top:2px}
.phone-body{padding:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#app-viewport{background:#fff}
#screen{position:relative;width:402px;height:874px;transform-origin:top left}
.dynamic-island{z-index:2147483646;pointer-events:none}
#bar{position:absolute;z-index:2147483645;top:18px;left:30px;width:342px;display:flex;justify-content:space-between;font:600 13px -apple-system;pointer-events:none}
#home{position:absolute;z-index:2147483645;bottom:8px;left:136px;width:130px;height:5px;background:#222;border-radius:4px;pointer-events:none}
body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}button,input,textarea{font:inherit}
#error{display:none;position:fixed;bottom:40px;background:#fff1ec;color:#9e2d13;padding:12px;font:12px sans-serif;z-index:2147483647}
</style></head><body><main class="phone-stage" id="phone-stage"><div class="phone-frame"><div class="phone-scale">
<span class="side-button action-button"></span><span class="side-button volume-up"></span><span class="side-button volume-down"></span><span class="side-button power-button"></span>
<div class="phone-body"><div id="app-viewport" class="app-viewport"><div id="screen"></div><div class="dynamic-island"><span class="island-camera"></span></div><div id="bar"><span>9:41</span><span>▂▄▆ ▰</span></div><div id="home"></div></div></div>
</div></div></main><div id="error"></div><script>const TOKEN=new URLSearchParams(location.search).get('token');for(const path of ['/engine.js','/native-ui.js','/preview.js']){const s=document.createElement('script');s.src=path+'?token='+TOKEN;s.async=false;document.head.append(s)}</script></body></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="client-token" content="__CSRF__"><title>HTML Native Studio · 实时镜像</title><style>html,body{margin:0;background:#edf1f6;font:13px -apple-system,sans-serif;height:100%}header{height:36px;display:flex;align-items:center;gap:20px;padding:0 14px;background:white;color:#536273}main{height:calc(100% - 36px);display:flex;align-items:center;justify-content:center}img{max-width:100%;max-height:100%;object-fit:contain}#waiting{color:#718096}img[hidden]{display:none}</style><header><b>工作台实时镜像 · 操作同步</b><span id="status">等待工作台画面</span><input id="entry" placeholder="输入文字后点写入"><button id="write">写入选中输入框</button><span id="error"></span></header><main><span id="waiting">打开桌面工作台后，画面会自动同步到这里。</span><img id="screen" hidden alt="桌面工作台当前画面"></main><script>
let current;const csrf=document.querySelector('meta[name="client-token"]').content;
async function command(body){try{const r=await fetch('/api/mirror/input',{method:'POST',headers:{'Content-Type':'application/json','x-client-token':csrf},body:JSON.stringify(body)});if(!r.ok)throw Error((await r.json()).error);document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}
function point(event){const r=screenImage.getBoundingClientRect();return {x:(event.clientX-r.left)/r.width,y:(event.clientY-r.top)/r.height}}
document.getElementById('write').onclick=()=>command({kind:'text',text:document.getElementById('entry').value});
async function refresh(){try{const r=await fetch('/api/mirror/frame',{cache:'no-store'});if(r.status===200){const updated=Number(r.headers.get('X-Mirror-Updated'));const url=URL.createObjectURL(await r.blob());screenImage.src=url;screenImage.hidden=false;document.getElementById('waiting').hidden=true;if(current)URL.revokeObjectURL(current);current=url;document.getElementById('status').textContent=Date.now()-updated<6000?'正在同步':'工作台未更新 · 显示最后画面'}else document.getElementById('status').textContent='等待桌面工作台'}catch{document.getElementById('status').textContent='工作台未启动 · 自动重连中'}finally{setTimeout(refresh,1200)}}const screenImage=document.getElementById('screen');screenImage.onclick=e=>command({kind:'click',...point(e)});screenImage.addEventListener('wheel',e=>{e.preventDefault();command({kind:'scroll',...point(e),dy:e.deltaY})},{passive:false});refresh();</script></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="client-token" content="__CSRF__"><title>HTML Native Studio</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="client-topbar"><div><button id="toggle-left" class="icon-btn" title="收起左侧栏" aria-label="收起左侧栏"><i data-lucide="panel-left"></i></button><div class="segmented"><button id="left-projects" class="selected">项目与对话</button><button id="left-library">页面与资源</button><button id="left-tools">工具</button></div></div><div class="preview-mode segmented" role="group" aria-label="预览模式"><button id="top-edit-mode" title="选取与编辑（Ctrl + Q 切换）" class="selected" aria-pressed="true">选取与编辑</button><button id="top-run-mode" title="运行预览（Ctrl + Q 切换）" aria-pressed="false">运行预览</button></div><div class="top-ios-tools"><button id="top-run-ios" class="subtle" title="运行或重启当前项目的 iOS">运行 iOS</button><button id="top-link-ios" class="subtle">两端联动</button><button id="top-sync-menu" class="subtle" title="查看同步状态、检查并修复同步">同步状态 ▾</button></div><div class="topbar-center"><span>HTML 原生工作台</span><button class="subtle" id="top-external"><i data-lucide="external-link"></i>外部窗口</button></div><div><div class="segmented"><button id="right-chat" class="selected">对话</button><button id="right-properties">编辑属性</button></div><button id="toggle-right" class="icon-btn" title="收起右侧栏" aria-label="收起右侧栏"><i data-lucide="panel-right"></i></button></div></header>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon"><i data-lucide="panels-top-left"></i></span><div>原生工作台<small>WITH CODEX</small></div></div>
    <nav class="main-nav"><button class="nav active" id="workbench-nav"><i data-lucide="layout-dashboard"></i>工作台</button><button class="nav" id="new-thread"><i data-lucide="square-pen"></i>新对话<span class="shortcut">⌘ N</span></button><button class="nav" id="new-project"><i data-lucide="folder-plus"></i>创建新系统</button><button class="nav" id="skills-nav"><i data-lucide="sparkles"></i>技能</button><button class="nav" id="plugins-nav"><i data-lucide="puzzle"></i>插件</button><button class="nav" id="memory-nav"><i data-lucide="brain"></i>记忆</button></nav>
    <div class="sidebar-scroll">
      <section id="pinned-section" class="hidden"><div class="sidebar-section-heading"><span>置顶</span></div><div id="pinned-threads"></div></section>
      <section><div class="sidebar-section-heading"><button id="project-section-toggle" class="section-toggle" aria-expanded="true">项目<i data-lucide="chevron-down"></i></button><div><button class="icon-btn" id="project-section-menu" title="项目菜单" aria-label="项目菜单"><i data-lucide="ellipsis"></i></button><button class="icon-btn" id="project-add" title="添加项目" aria-label="添加项目"><i data-lucide="plus"></i></button></div></div><div id="projects"></div><button id="show-projects" class="expand-section">展开显示</button></section>
      <section><div class="sidebar-section-heading"><button id="recent-section-toggle" class="section-toggle" aria-expanded="true">最近<i data-lucide="chevron-down"></i></button><div><button class="icon-btn" id="recent-section-menu" title="最近对话菜单" aria-label="最近对话菜单"><i data-lucide="ellipsis"></i></button><button class="icon-btn" id="recent-add" title="新对话" aria-label="最近新对话"><i data-lucide="plus"></i></button></div></div><div id="recent-threads"></div><button id="show-recent" class="expand-section hidden">显示更多</button></section>
    </div>
    <div class="sidebar-footer"><div class="sidebar-bottom-tools"><button class="icon-btn" id="sidebar-search" title="搜索" aria-label="搜索项目与对话"><i data-lucide="search"></i></button><button class="icon-btn" id="settings" title="连接与设置" aria-label="连接与设置"><i data-lucide="settings-2"></i></button><button class="icon-btn" id="import-project" title="导入 HTML 项目" aria-label="导入 HTML 项目"><i data-lucide="folder-input"></i></button><span id="sidebar-sync-state">正在同步</span></div><div class="account"><button id="account-menu" class="account-button"><span class="avatar"><i data-lucide="user-round"></i></span><span><strong>Codex</strong><small id="account-status">正在连接…</small></span></button><span class="status-dot" id="account-dot"></span><button class="icon-btn" id="sidebar-help" aria-label="帮助" title="帮助"><i data-lucide="circle-help"></i></button></div></div>
  </aside>
  <main class="workspace">
    <header class="workspace-header"><div class="breadcrumb"><i data-lucide="folder-open"></i><span id="project-title">工作台</span><span class="separator">/</span><span class="muted">设计与预览</span></div><div class="header-actions"><button class="subtle" id="reveal"><i data-lucide="folder"></i>源码</button><button class="subtle" id="external"><i data-lucide="external-link"></i>外部窗口</button></div></header>
    <div class="toolbar"><div class="segmented" role="group" aria-label="工作模式"><button id="edit-mode" class="selected"><i data-lucide="mouse-pointer-2"></i>编辑</button><button id="run-mode"><i data-lucide="play"></i>运行预览</button></div><div class="toolbar-right"><span id="sync-status" class="sync"><span class="status-dot"></span>正在同步</span><button class="icon-btn" id="repair" title="检查并修复同步" aria-label="检查并修复同步"><i data-lucide="refresh-cw"></i></button><button class="icon-btn" id="inspect" title="图层与属性" aria-label="图层与属性"><i data-lucide="sliders-horizontal"></i></button><button class="subtle" id="export"><i data-lucide="download"></i>导出 iOS</button></div></div>
    <div class="canvas-layout"><section class="code-project-placeholder"><i data-lucide="folder-code"></i><h2 id="code-project-title">Codex 项目</h2><p id="code-project-path"></p><p>在下方继续对话，修改会保存到此项目。</p><button type="button" class="primary" id="connect-workbench">接入工作台</button><button type="button" class="secondary" id="open-code-project">打开项目文件夹</button></section>
      <section class="canvas" id="canvas"><div class="canvas-top"><div><span class="eyebrow">实时工作区</span><h1 id="canvas-title">你的 App，在这里成形</h1></div><select id="page-select" aria-label="当前页面"></select></div>
        <div class="devices"><section class="device-column"><div class="device-label"><span><i data-lucide="smartphone"></i>iOS 原生</span><span class="tag">真实模拟器</span></div><div class="phone-area"><div class="ios-device" id="ios-device" tabindex="0" aria-label="iOS 原生模拟器"><img id="ios-frame" alt="iOS 实时预览" draggable="false"><div id="ios-wait">正在连接模拟器…</div><div id="selection-box"></div></div></div></section><section class="device-column"><div class="device-label"><span><i data-lucide="code-2"></i>HTML 原型</span><span class="tag">实时同步</span></div><div class="phone-area"><iframe id="html-preview" title="HTML 原型实时预览" src="about:blank"></iframe></div></section></div>
        <div class="canvas-bottom"><span id="canvas-hint">选择图层可修改外观；切换运行预览可体验交互</span><button class="subtle" id="run-ios"><i data-lucide="rotate-cw"></i>重启 iOS</button></div>
      </section>
      <aside class="inspector hidden" id="inspector"><div class="inspector-title">图层与属性<button class="icon-btn" id="close-inspector" aria-label="关闭属性"><i data-lucide="x"></i></button></div><div id="inspector-content"></div></aside>
    </div>
    <section class="composer-wrap"><div id="selected-skills" class="attachments"></div><div id="attachments" class="attachments"></div><form id="composer"><label for="prompt" class="sr-only">描述你想做的修改</label><textarea id="prompt" placeholder="描述你的 App，或告诉 Codex 要修改哪里…" rows="2"></textarea><div class="composer-tools"><div class="composer-left"><button type="button" class="icon-btn" id="attach" title="添加文件或图片" aria-label="添加文件或图片"><i data-lucide="plus"></i></button><button type="button" class="icon-btn" id="choose-skill" title="选择技能" aria-label="选择技能"><i data-lucide="sparkles"></i></button><input type="file" id="file-input" multiple hidden><span class="scope"><i data-lucide="folder-lock"></i>当前项目</span><span id="composer-context" class="composer-context">新对话</span></div><div class="composer-right"><button type="button" id="model-picker" class="model-picker" aria-label="选择 Codex 模型">默认模型 ▾</button><select id="model" aria-label="Codex 模型" hidden><option value="">默认模型</option></select><button type="button" id="speed" class="speed-button" aria-label="切换加速模式" aria-pressed="false" title="标准速度"><i data-lucide="zap"></i><span>标准</span></button><select id="effort" aria-label="思考深度"><option value="">默认</option></select><button id="send" class="send" type="submit" title="发送" aria-label="发送"><i data-lucide="arrow-up"></i></button></div></div></form><div class="composer-footnote"><span>Enter 发送 · Shift Enter 换行</span><span id="run-status">修改会自动同步到预览</span></div></section>
  </main>
  <aside class="chat-panel"><header class="chat-header"><div><i data-lucide="messages-square"></i><strong>对话记录</strong></div><button class="icon-btn" id="rename-thread" aria-label="重命名当前对话" title="重命名当前对话"><i data-lucide="pencil"></i></button></header><div class="chat-subheader"><span id="thread-title">新的开始</span><span id="chat-status">就绪</span></div><div class="messages" id="messages"><div class="chat-empty"><div class="empty-mark"><i data-lucide="message-circle"></i></div><h2>从一个想法开始</h2><p>在下方输入需求，或者添加参考图。<br>Codex 会修改当前项目，<br>你可以在中间实时查看效果。</p><div class="empty-detail"><i data-lucide="folder-check"></i><span>每个项目独立保存<br>每段对话都可以继续</span></div></div></div><div id="requests" class="requests"></div></aside>
</div>
<div id="sidebar-menu" class="sidebar-menu hidden" role="menu"></div>
<div id="toast" class="toast hidden" role="status"></div>
<dialog id="dialog"><form method="dialog" id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon-btn" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="dialog-content"></div><div id="dialog-error" class="form-error"></div><div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button type="button" id="dialog-submit" class="primary">创建</button></div></form></dialog>
<script src="/vendor/lucide.js"></script><script src="/vendor/marked.js"></script><script src="/vendor/purify.js"></script><script type="module" src="/app.js"></script>
</body></html>
